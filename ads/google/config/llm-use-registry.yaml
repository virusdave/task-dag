# LLM Use Registry for Google Ads Content Optimization
# Documents all LLM usage in the three-layer system

version: "1.0.0"

# Governance reference
governance_document: "docs/policy-review-compliance-architecture.md"

# Use cases
use_cases:
  gads-ads-l1-spot-check:
    description: "Sample-based anomaly detection on ads per creative family"
    layer: "L1"
    scope: "Per-family (3-5 ads sampled)"
    input_format: "Ad text fields + L1 features + family summary + policy anecdotes"
    output_format: "Structured JSON (L1SpotCheckResult)"
    frequency: "Per L2 run (daily)"
    cost_per_call: 0.02
    typical_calls_per_run: 50  # One per family
    governance: "policy-review-compliance"
    constraints:
      - "No policy evasion recommendations"
      - "Only suggest deterministic checks"
      - "Flag borderline cases for human review"
    
  gads-ads-l2-content-optimization:
    description: "Predict Google Ads policy risks and propose repair/replace/trial actions"
    layer: "L2"
    scope: "Per-family aggregated summaries"
    input_format: "L1 summaries + spot-checks + policy experiences + trial outcomes"
    output_format: "Structured JSON (L2PredictionOutput)"
    frequency: "Per L2 run (daily)"
    cost_per_call: 1.00
    typical_calls_per_run: 50  # One per family
    governance: "policy-review-compliance"
    constraints:
      - "White-/grey-hat alignment required"
      - "All recommendations must be explainable"
      - "Trial designs must have clear hypotheses"
      - "Nearby strategy search for compliant alternatives"
      - "No deception or classifier-only tricks"
    north_star: "Optimize (limitation_avoidance × user_clarity × performance)"
    
  gads-ads-l3-prompt-improvement:
    description: "Meta-analyze L2 predictions vs outcomes, propose prompt/rule updates"
    layer: "L3"
    scope: "Full run across all families and trials"
    input_format: "L2 outputs + trial outcomes + actual family outcomes + evaluation metrics"
    output_format: "Structured JSON (L3EvaluationOutput) + Markdown proposals"
    frequency: "Weekly (Sunday)"
    cost_per_call: 7.00
    typical_calls_per_run: 1
    governance: "policy-review-compliance-plus-human-approval"
    constraints:
      - "Proposals only, no auto-application"
      - "All changes require testing"
      - "Version history tracking required"
      - "Approval/rejection must be documented"
      - "Check both policy AND performance outcomes"

# Cost estimates
cost_estimates:
  daily_l2_run:
    l1_spot_checks: 
      families: 50
      cost_per_family: 0.02
      total: 1.00
    l2_predictions:
      families: 50
      cost_per_family: 1.00
      total: 50.00
    daily_total: 51.00
    
  weekly_l3_analysis:
    runs_per_week: 1
    cost_per_run: 7.00
    weekly_total: 7.00
    
  monthly_total:
    l2_runs: 1530.00  # 51 × 30 days
    l3_runs: 28.00    # 7 × 4 weeks
    total: 1558.00
    
  comparison_to_naive:
    naive_cost_per_ad: 0.50
    ads_per_day: 100
    naive_daily: 50.00
    naive_monthly: 1500.00
    our_monthly: 1558.00
    notes: "Similar cost BUT we get L3 meta-learning and systematic trials"

# Version history
version_history:
  "1.0.0":
    date: "2026-05-15"
    changes:
      - "Initial registry"
      - "Three use cases defined"
      - "Cost estimates calculated"
    approved_by: "initial_deployment"
