# Strategic Search-Query Clusters
#
# Operator-curated strategic clusters consumed by:
#   - gads L2 cluster-sweep         (ads/google/lib/l2/cluster-sweep/)
#   - landing-pages L2 cluster mode (../mostly-static-sites/scripts/l2-cluster-landing-page-proposals.ts)
#
# Each cluster is a *target* for the cluster-sweep L2 to reconcile against
# current campaign + landing-page state. The L2 produces one of:
#   extend-existing | merge-into-existing | create-new | pause-and-replace
# per cluster, with rationale tying the verdict to specific existing
# campaign IDs from the latest snapshot.
#
# Provenance: operator-driven Gemini session
#   https://gemini.google.com/share/638489c01b1b
# Seeded from intake thread
#   T-019e3869-7170-7118-803e-0941d3f4bf28
#
# Schema: ads/google/lib/shared/strategicClustersSchema.ts (Zod).

version: "1.0.0"
provenance_url: "https://gemini.google.com/share/638489c01b1b"

# Operator notes that the L2 cluster-sweep should treat as binding context
# when reconciling — in particular: not all of these clusters are starting
# from scratch; several are already partially served by existing campaigns
# and should be extended or merged rather than duplicated.
operator_context: |
  Several of these clusters overlap existing campaigns. The cluster-sweep
  L2 MUST reconcile each cluster against the current snapshot's campaign
  list before proposing structure, and prefer extend/merge verdicts when
  a meaningful existing campaign already targets the cluster intent.

  Freshly Baked is a NY State licensed adult-use cannabis dispensary with
  storefronts in Midtown Manhattan and the Bronx (Arthur Ave), plus
  e-bike delivery to Manhattan and large parts of Western Queens /
  Brooklyn. The licensed-status + COD/debit-on-delivery + e-bike speed
  triad is the brand's distinguishing USP cluster and threads through
  several of the campaigns below.

clusters:

  # ───────────────────────────────────────────────────────────────────
  - slug: strain-brand-power
    display_name: "Strain & Brand Power"
    intent_summary: |
      Users searching for specific strains (Private Party, Frank Rizzo,
      Slurp Juice, ...) or brands (MFused, Leal, ...). 366+ unique
      query terms in this group. Highest-volume long-tail cluster.
    target_query_patterns:
      - "<strain-name>"
      - "<strain-name> nyc"
      - "<strain-name> dispensary"
      - "<brand-name>"
      - "<brand-name> nyc"
      - "<brand-name> dispensary near me"
    seed_keyword_examples:
      - "private party strain"
      - "frank rizzo strain"
      - "slurp juice strain"
      - "mfused vape"
      - "leal cannabis"
    proposed_landing_page_slug: "/strain-library"
    proposed_ad_themes:
      - "Browse <strain> in stock — licensed NY dispensary"
      - "<brand> available — pickup or delivery NYC"
    usp_hooks:
      - "in-stock right now"
      - "licensed adult-use, lab-tested"
    reconciliation_hint: |
      Possibly already partly covered by per-brand / per-category
      campaigns. Check for existing strain-specific campaign groups
      before proposing a new umbrella structure; the right move is
      likely a unified strain-library landing + extension of existing
      category campaigns to deep-link there.

  # ───────────────────────────────────────────────────────────────────
  - slug: local-discovery
    display_name: "Local Discovery"
    intent_summary: |
      "dispensary near me" + variants. ~200,000 impressions but
      relatively low CTR — high volume, mobile-heavy, foot-traffic
      intent. Wants a map + directions + hours, not a menu page.
    target_query_patterns:
      - "dispensary near me"
      - "weed dispensary near me"
      - "cannabis store near me"
      - "open dispensary now"
      - "dispensary open late nyc"
    seed_keyword_examples:
      - "dispensary near me"
      - "weed dispensary near me"
      - "dispensary open now"
    proposed_landing_page_slug: "/visit-us"
    proposed_ad_themes:
      - "Visit our Midtown or Bronx store — directions + hours"
      - "Open now — get directions in 1 tap"
    usp_hooks:
      - "two physical locations"
      - "licensed adult-use"
    reconciliation_hint: |
      Likely already represented by a "near me" campaign. Reconcile
      against existing geo-targeted campaigns; the gap is probably
      a mobile-first /visit-us landing rather than new ad structure.

  # ───────────────────────────────────────────────────────────────────
  - slug: delivery-revamped
    display_name: "Delivery — Revamped (cash/debit + e-bike speed)"
    intent_summary: |
      Previous delivery campaign drove in-store sales but failed to
      convert delivery orders. The $20 first-order discount went
      unclaimed on the delivery side. The revamp anchors on Freshly
      Baked's TWO unique USPs among NY licensed delivery operations:
      (1) cash OR debit on delivery (every other licensed competitor
      requires bank-account linking), and (2) e-bike fleet that
      bypasses BQE / Midtown gridlock from Midtown + Bronx hubs.
      Splits into two sub-campaigns (financial-privacy + traffic-
      agnostic-speed) sharing a delivery landing page family.
    target_query_patterns:
      - "weed delivery <borough>"
      - "cannabis delivery <neighborhood>"
      - "fast weed delivery"
      - "no fee weed delivery"
      - "dispensary delivery cash"
      - "weed delivery debit card"
      - "licensed weed delivery <borough>"
    seed_keyword_examples:
      - "weed delivery bronx"
      - "weed delivery manhattan"
      - "cannabis delivery long island city"
      - "express weed delivery brooklyn"
      - "weed delivery cash"
      - "dispensary delivery debit card nyc"
      - "no bank link cannabis delivery"
    proposed_landing_page_slug: "/delivery"
    proposed_ad_themes:
      - "Buy Legal. Pay Analog. Cash or debit at the door."
      - "Bypass the gridlock — e-bike delivery in <60min"
      - "No fees, no bank-link, $20 off first $100"
    usp_hooks:
      - "cash OR debit on delivery (unique among NY licensed)"
      - "no bank-account linking required"
      - "e-bike speed (no BQE gridlock)"
      - "no delivery fees, low minimums"
      - "$20 off first $100 order"
    reconciliation_hint: |
      The existing delivery campaign exists but underperformed on
      its stated goal. The right move is likely pause-and-replace
      with TWO sub-campaigns: financial-privacy (cash/debit USP) and
      traffic-agnostic-speed (e-bike USP). Keep the $20 off but
      reframe as a service-incentive rather than a price-incentive.
      Landing page splits into /cashless-delivery + /delivery-map
      child pages off the existing /delivery root.

  # ───────────────────────────────────────────────────────────────────
  - slug: bronx-arthur-ave
    display_name: "Bronx / Arthur Ave"
    intent_summary: |
      Users searching for a Bronx-area dispensary or Arthur Ave
      neighborhood cannabis. Local-identity intent that should
      lean into the Arthur Ave neighborhood to build trust over
      generic corporate competitors.
    target_query_patterns:
      - "dispensary bronx"
      - "weed bronx"
      - "cannabis bronx"
      - "arthur ave dispensary"
      - "dispensary <bronx-neighborhood>"
    seed_keyword_examples:
      - "dispensary bronx"
      - "weed dispensary bronx"
      - "arthur ave cannabis"
      - "fordham dispensary"
    proposed_landing_page_slug: "/bronx-dispensary"
    proposed_ad_themes:
      - "Arthur Ave's licensed adult-use dispensary"
      - "Your Bronx neighborhood dispensary"
    usp_hooks:
      - "Arthur Ave physical store"
      - "local Bronx-owned-and-operated framing"
      - "licensed adult-use"
    reconciliation_hint: |
      May overlap with the local-discovery cluster's geo targeting.
      Reconcile so Bronx-specific queries route to /bronx-dispensary
      while generic /visit-us serves both stores. Likely create-new
      for the landing page but extend-existing on the campaign side.

  # ───────────────────────────────────────────────────────────────────
  - slug: brand-protection
    display_name: "Brand Protection"
    intent_summary: |
      Direct-name queries ("freshly baked nyc", misspellings like
      "freshley baked", "freshly baked dispensary"). Highest intent +
      highest CTR (>42%). Branded search ads here ensure competitors
      can't steal high-intent traffic with their own branded bids.
    target_query_patterns:
      - "freshly baked nyc"
      - "freshly baked dispensary"
      - "<brand-misspellings>"
    seed_keyword_examples:
      - "freshly baked nyc"
      - "freshly baked dispensary"
      - "freshley baked"
      - "freshly baked weed"
    proposed_landing_page_slug: "/"
    proposed_ad_themes:
      - "Freshly Baked NYC — Official site"
      - "Visit Freshly Baked — Midtown & Bronx"
    usp_hooks:
      - "official site"
      - "two licensed NY storefronts"
    reconciliation_hint: |
      Likely already exists as a branded-search campaign. Reconcile
      negative-keyword coverage and ensure misspellings + competitor-
      bidding-on-our-brand defensive coverage is included.

  # ───────────────────────────────────────────────────────────────────
  - slug: general-category
    display_name: "General Category"
    intent_summary: |
      Broad terms — "dispensary", "weed", "cannabis" — without
      location or product attached. Discovery-phase users, often
      not yet decided on a specific shop. Position Freshly Baked as
      the licensed, trusted choice in a market saturated with
      unlicensed smoke shops.
    target_query_patterns:
      - "dispensary"
      - "weed"
      - "cannabis"
      - "dispensary nyc"
      - "weed nyc"
    seed_keyword_examples:
      - "dispensary nyc"
      - "weed nyc"
      - "best dispensary nyc"
      - "where to buy weed"
    proposed_landing_page_slug: "/new-customer-guide"
    proposed_ad_themes:
      - "New to legal cannabis? Start here — licensed NY adult-use"
      - "Why shop with Freshly Baked? Licensed, lab-tested, two stores"
    usp_hooks:
      - "licensed adult-use (vs. unlicensed smoke shops)"
      - "lab-tested products"
      - "first-time customer guidance"
    reconciliation_hint: |
      Likely a thin or absent campaign currently. Create-new is
      probably right. Landing page should not be the menu — it
      should be an educational / trust-building page that converts
      onto the menu.

  # ───────────────────────────────────────────────────────────────────
  # Speculative — campaigns Gemini identified as likely overlooked
  # by competitors and high-intent. Operator endorsed both.
  # ───────────────────────────────────────────────────────────────────

  - slug: financial-logistics
    display_name: "Financial Logistics (speculative)"
    intent_summary: |
      Transactional-friction queries. The "how I pay" is often a
      higher-intent signal in legal cannabis than "what I buy"
      because federal banking restrictions make payment the final
      hurdle. Freshly Baked's COD/debit USP directly resolves this
      friction; this cluster captures users actively solving for
      payment method.
    target_query_patterns:
      - "<dispensary-near-me> apple pay"
      - "<dispensary> credit card"
      - "<dispensary> tap to pay"
      - "<dispensary> debit"
      - "<competitor-name> payment method"
    seed_keyword_examples:
      - "dispensaries that take apple pay nyc"
      - "can i use a credit card at a bronx dispensary"
      - "nyc dispensaries with tap to pay"
      - "weed delivery debit card"
      - "dispensary that takes cash"
    proposed_landing_page_slug: "/cashless-and-licensed"
    proposed_ad_themes:
      - "Keep your cash. We bring the card reader to you."
      - "Licensed delivery. No bank account required."
    usp_hooks:
      - "cash OR debit on delivery (unique in NY)"
      - "no bank-account linking (no Plaid)"
      - "in-store debit + cash accepted"
    reconciliation_hint: |
      Almost certainly no existing campaign. Create-new. Landing
      page is the same /cashless-and-licensed used by the delivery-
      revamped financial-privacy sub-campaign — share it.

  - slug: regulatory-legitimacy
    display_name: "Regulatory Legitimacy (speculative)"
    intent_summary: |
      Users actively distinguishing licensed shops from unlicensed
      smoke shops. Growing segment as NY enforcement headlines
      raise consumer awareness. Information-to-sale intent: they
      want proof of legitimacy before buying.
    target_query_patterns:
      - "licensed dispensary <neighborhood>"
      - "real dispensary nyc"
      - "is <shop-name> licensed"
      - "lab tested cannabis nyc"
      - "legal weed dispensary nyc"
    seed_keyword_examples:
      - "licensed dispensary manhattan"
      - "licensed dispensary bronx"
      - "real legal dispensary nyc"
      - "lab tested cannabis nyc"
      - "OCM licensed dispensary"
    proposed_landing_page_slug: "/regulatory-trust"
    proposed_ad_themes:
      - "Guaranteed licensed. Guaranteed lab-tested."
      - "How to tell a legal NY dispensary from a smoke shop"
    usp_hooks:
      - "OCM-licensed adult-use"
      - "lab-tested products with COA links"
      - "two physical NY storefronts (not a popup)"
    reconciliation_hint: |
      Likely no existing campaign. Create-new. May share content
      between /regulatory-trust and /new-customer-guide; reconcile
      so they don't duplicate trust signals; the L2 should decide
      whether to merge them or keep them distinct based on which
      user intent each is being asked to close.
