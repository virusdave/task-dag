# L2 LLM Prompts Configuration
# Version: 1.0.0

version: "1.0.0"

# Main L2 prediction and strategy prompt
main_prompt:
  use_case: "gads-ads-l2-content-optimization"
  
  system_prompt: |
    You are a Google Ads policy compliance expert specializing in cannabis advertising.
    
    Your role is to:
    1. Predict policy risk for creative families based on L1 feature summaries
    2. Propose repair/replace/pause actions for problematic ads
    3. Design experimental trial groups to probe Google's policy enforcement
    
    CRITICAL CONSTRAINTS:
    - Maintain white-/grey-hat alignment: NEVER recommend deception or policy evasion
    - Optimize for (limitation_avoidance × user_clarity × performance)
    - Use "nearby strategy search" to find compliant alternatives
    - All recommendations must be grounded in observed patterns and experiences
    
    NORTH STAR PHILOSOPHY:
    - Google's policy enforcement is an opaque stochastic system
    - We learn through systematic observation and controlled experimentation
    - Our goal aligns with Google's: serve users well with clear, compliant ads
    - We probe policy boundaries to understand them, not to evade them
    
  user_prompt_template: |
    Analyze the following creative families and provide risk predictions and action plans.
    
    ## L1 Family Summaries
    {l1_family_summaries}
    
    ## L1 Spot-Check Results
    {l1_spot_check_results}
    
    ## Google Ads Policy Experiences
    {policy_experiences}
    
    ## Recent Trial Outcomes (if available)
    {trial_outcomes}
    
    For each family, provide:
    
    1. **Family Risk Assessment**
       - Risk level: high | medium | low
       - Risk score: 0-1 continuous score
       - Identified issues with severity and affected ad count
    
    2. **Ad-Level Actions**
       For each problematic ad, recommend ONE action:
       
       **Repair** (inline edit):
       - Use when: Small wording change can fix issue
       - Provide: Before/after text snippets
       - Assign: CSV batch 002
       
       **Replace** (new compliant creative):
       - Use when: Significant rewrite needed
       - Provide: 1-3 new creative variants
       - Assign: CSV batch 003
       - Optionally: Pause original (CSV 004)
       
       **Pause**:
       - Use when: High confidence the ad is unfixable
       - Provide: Strong justification
       - Assign: CSV batch 004
       - GUARDRAIL: Use sparingly, only for clear policy violations
       
       **Monitor Only**:
       - Use when: Borderline case, want to observe
       - Provide: What to watch for
    
    3. **Trial Plans**
       Design experimental trials to probe policy boundaries:
       
       **Structure**:
       - Trial group name: <original-ad-group>-trial-00N
       - Budget: $1/day
       - Controls: 1-2 ads (current approved or known safe)
       - Variants: 1-3 ads (small, controlled deviations)
       
       **Requirements**:
       - Clear hypothesis (what are we testing?)
       - Specific policy class being probed
       - Success criteria (serving status, performance thresholds)
       - Expected insights
       
       **Trial Types**:
       - **Pattern isolation**: Test if a specific pattern triggers limitation
       - **Alternative phrasing**: Test compliant alternatives to risky phrasing
       - **Boundary probing**: Test where policy enforcement threshold lies
       
       Assign: CSV batches 001 (create group) and 005 (create ads)
    
    4. **L1 Rule Updates**
       Suggest improvements to L1 feature extractors based on:
       - Patterns L1 missed that you spotted
       - False positives from L1
       - New pattern categories to track
    
    Output as JSON matching L2PredictionOutput schema.
    
    Remember: Every recommendation must be explainable, grounded in data, and
    aligned with white-/grey-hat principles. If uncertain, design a trial to learn.

# Risk scoring parameters
risk_scoring:
  # Feature weights for risk calculation
  feature_weights:
    policy_status:
      disapproved: 1.0
      approved_limited: 0.7
      under_review: 0.5
      approved: 0.0
      
    text_patterns:
      urgency_score: 0.3
      hype_score: 0.4
      medical_claim_patterns: 0.8
      superlative_usage: 0.2
      restricted_vocab_buckets: 0.9
      
    structure:
      redundancy_score: 0.1
      missing_elements: 0.05
      
    landing_linkage:
      high_risk: 0.6
      medium_risk: 0.3
      low_risk: 0.0
      
  # Risk level thresholds
  thresholds:
    high: 0.7
    medium: 0.4
    low: 0.0

# Action selection logic
action_selection:
  # When to recommend repair vs replace
  repair_threshold: 0.3  # Low-complexity changes
  replace_threshold: 0.7  # High-complexity changes
  pause_threshold: 0.9   # Very high confidence of violation
  
  # Repair action guidelines
  repair:
    max_headline_changes: 2  # Max headlines to modify
    max_description_changes: 1  # Max descriptions to modify
    preserve_core_message: true
    
  # Replace action guidelines
  replace:
    variants_per_ad: 2  # How many replacement variants to suggest
    reuse_templates: true  # Group similar replacements
    
  # Pause action guidelines
  pause:
    require_high_confidence: true
    require_repeated_disapproval: true
    never_pause_all: true  # Always keep some ads running

# Trial design parameters
trial_design:
  # Trial naming with GLOBAL sequencing across all runs
  # Format: 00001-<campaign/group>-trial-001, 00001-<campaign/group>-trial-002
  # Next batch: 00002-<campaign/group>-trial-001, ..., 00002-<campaign/group>-trial-107
  trial_name_pattern: "{global_batch:05d}-{original_ad_group}-trial-{sequence:03d}"
  
  # Budget settings - MICROSCOPIC for policy probing, not ad serving
  default_budget_usd: 0.01  # Or whatever minimum Google accepts
  max_budget_usd: 0.05
  
  # Trial composition - can be large batches (10-1000 experiments)
  controls_per_trial: 1  # Single baseline for comparison
  variants_per_trial_range: [1, 1000]  # Arbitrary sized parallel experiments
  
  # Success criteria - policy probe lifecycle
  default_success_criteria:
    # Check approval status at intervals, then REMOVE completely
    check_intervals_hours: [1, 4, 24, 48]
    # Don't care about impressions - this is policy probing, not ad serving
    min_impressions: null
    allowed_serving_statuses:
      - "eligible"
      - "eligible_limited"
    # After final check, remove trial group entirely
    auto_remove_after_hours: 48
      
  # Trial categories
  trial_categories:
    - pattern_isolation      # Test if specific pattern triggers limitation
    - alternative_phrasing   # Test compliant alternatives
    - boundary_probing       # Test where policy threshold lies
    - vocab_permutations     # Systematic vocab testing
    
  # Experiment throttling - can be large batches
  max_trials_per_family: 100  # Large parallel experiment sets
  max_total_trials_per_run: 1000  # Up to 1000 experiments per run
  max_trials_per_batch: 1000  # Max in single global batch

# CSV batch assignment
csv_batches:
  "001":
    name: "create-trial-campaigns-and-ad-groups"
    description: "Set up trial campaign and ad group infrastructure"
    action_types: []  # Trials only
    
  "002":
    name: "repair-existing-ads"
    description: "Inline edits to existing ads"
    action_types: ["repair"]
    
  "003":
    name: "replace-and-new-ads"
    description: "New compliant creatives"
    action_types: ["replace"]
    
  "004":
    name: "pause-high-risk-ads"
    description: "Pause obviously-bad assets"
    action_types: ["pause"]
    guardrails:
      - "Small batch only (max 10% of family ads)"
      - "High confidence required"
      - "Highlight prominently in HTML"
      
  "005":
    name: "create-trial-ads"
    description: "Populate trial groups with controls and variants"
    action_types: []  # Trials only

# White-/grey-hat constraints
constraints:
  forbidden_tactics:
    - "Cloaking (showing different content to Google vs users)"
    - "Misleading representations of products or services"
    - "Implied medical claims without proper disclaimers"
    - "Regulatory evasion language"
    - "Classifier-only evasion (tricks that fool AI but not humans)"
    
  required_principles:
    - "User clarity: Ads must be clear and understandable to users"
    - "Honest representation: Ads must accurately represent products/services"
    - "Compliance-first: When in doubt, err on side of compliance"
    - "Transparency: All experiments must be clearly labeled and tracked"
    
  nearby_strategy_search:
    enabled: true
    description: |
      When a pattern appears to violate policy, search for "nearby" alternatives:
      - More specific wording (e.g., "cannabis products" → "cannabis accessories")
      - Educational framing (e.g., "gets you high" → "psychoactive effects")
      - Disclaimer additions (e.g., "cures pain" → "may help with discomfort*")
      - Softer claims (e.g., "guaranteed" → "often effective")
      
      Test alternatives via trials to learn which are both compliant AND effective.
