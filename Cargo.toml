[package]
name = "task-dag"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Git-native task-dag v2 CLI"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "task-dag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
test-seam = []

[dev-dependencies]
proptest = "1"
