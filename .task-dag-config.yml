# Task-DAG Configuration for FreshlyBakedNYC/automation

# Comment limits
max_comment_size: 2048
max_daily_comments: 20

# Rate limits
max_active_issues: 20

# Feature flags
enable_auto_frontier: true
enable_state_change_tasks: false  # V2 feature

# Refs namespace
refs_namespace: "refs/gh"

# Repository-specific notes
# This repo uses the canonical task-dag reusable workflows from virusdave/task-dag
