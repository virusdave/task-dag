name: Issue Comment Sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  sync-comment-to-task:
    uses: Nicponskis/shared-workflows/.github/workflows/sync-comment-to-task.yml@master
    with:
      max_comment_size: 2048
      max_daily_comments: 20
      enable_auto_frontier: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
