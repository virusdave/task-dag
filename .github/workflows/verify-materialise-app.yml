name: Verify materialisation App authority

# Temporary caller-compatibility shim. v1 automation is retired; Rust v2 is
# provider-free. This workflow intentionally performs no checkout or write.
on:
  workflow_call:
    inputs:
      app_slug:
        description: Expected GitHub App slug.
        required: true
        type: string
      creator_node_id:
        description: Expected node ID of the App bot account.
        required: true
        type: string
      destinations:
        description: 'JSON array of {owner,repository,repositoryId} destinations.'
        required: true
        type: string

    secrets:
      TASK_DAG_APP_ID:
        required: false
      TASK_DAG_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  retired:
    name: v1 automation retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "task-dag v1 automation is retired; Rust v2 is provider-free."
