name: Verify materialisation App authority

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: Expected GitHub App slug.
        required: true
        type: string
      creator_node_id:
        description: Expected node ID of the App bot account.
        required: true
        type: string
      destinations:
        description: 'JSON array of {owner,repository,repositoryId} destinations.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.destination.owner }}/${{ matrix.destination.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(inputs.destinations) }}
    steps:
      - name: Mint least-privilege destination token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TASK_DAG_APP_ID }}
          private-key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}
          owner: ${{ matrix.destination.owner }}
          repositories: ${{ matrix.destination.repository }}
          permission-issues: write
          permission-metadata: read

      - name: Verify App and destination identities
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CREATOR_NODE_ID: ${{ inputs.creator_node_id }}
          EXPECTED_APP_SLUG: ${{ inputs.app_slug }}
          EXPECTED_REPOSITORY: ${{ matrix.destination.owner }}/${{ matrix.destination.repository }}
          EXPECTED_REPOSITORY_ID: ${{ matrix.destination.repositoryId }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = "$EXPECTED_APP_SLUG"
          actor=$(gh api "users/${APP_SLUG}%5Bbot%5D")
          repository=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$EXPECTED_REPOSITORY")
          test "$(jq -r .type <<<"$actor")" = Bot
          test "$(jq -r .node_id <<<"$actor")" = "$CREATOR_NODE_ID"
          test "$(jq -r .node_id <<<"$repository")" = "$EXPECTED_REPOSITORY_ID"
          test "$(jq -r .full_name <<<"$repository" | tr '[:upper:]' '[:lower:]')" \
            = "$(tr '[:upper:]' '[:lower:]' <<<"$EXPECTED_REPOSITORY")"
          jq -ncS \
            --arg appSlug "$APP_SLUG" \
            --arg creatorLogin "$(jq -r .login <<<"$actor")" \
            --arg creatorNodeId "$CREATOR_NODE_ID" \
            --arg repository "$(jq -r .full_name <<<"$repository")" \
            --arg repositoryId "$EXPECTED_REPOSITORY_ID" \
            '{appSlug:$appSlug,creatorLogin:$creatorLogin,creatorNodeId:$creatorNodeId,permissions:{issues:"write",metadata:"read"},repository:$repository,repositoryId:$repositoryId,verified:true}'
