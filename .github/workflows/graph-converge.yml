name: Graph Converge

# Temporary caller-compatibility shim. v1 automation is retired; Rust v2 is
# provider-free. This workflow intentionally performs no checkout or write.
on:
  workflow_call:
    inputs:
      base_sha:
        description: github.event.before from a push; empty for periodic backstop only.
        required: false
        type: string
        default: ''
      head_sha:
        description: github.sha from a push; empty for periodic backstop only.
        required: false
        type: string
        default: ''
      ref:
        description: task-dag ref to fetch the canonical CLI from.
        required: false
        type: string
        default: master

permissions: {}

jobs:
  retired:
    name: v1 automation retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "task-dag v1 automation is retired; Rust v2 is provider-free."
