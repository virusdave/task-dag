name: Task-DAG

# Single, logic-free caller for all task-dag GitHub-Actions automation.
# All logic, scripts, and config live once in virusdave/task-dag; this file
# is pure event wiring. See virusdave/task-dag:docs/MIGRATION.md.

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  push:
    branches: [master]

jobs:
  issue-to-task:
    if: ${{ github.event_name == 'issues' }}
    uses: virusdave/task-dag/.github/workflows/issue-to-task.yml@main
    permissions:
      contents: write
      issues: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  comment-sync:
    if: ${{ github.event_name == 'issue_comment' }}
    # Serialize ingestion per issue so concurrent comments cannot race
    # through comment-sync -> ingest-comment -> close-epic. Distinct issues
    # stay parallel.
    concurrency:
      group: task-dag-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: virusdave/task-dag/.github/workflows/sync-comment-to-task.yml@main
    permissions:
      contents: write
      issues: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  close-completed:
    if: ${{ github.event_name == 'push' }}
    uses: virusdave/task-dag/.github/workflows/close-completed-issues.yml@main
    permissions:
      contents: read
      issues: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  completion-aggregate:
    if: ${{ github.event_name == 'push' }}
    uses: virusdave/task-dag/.github/workflows/aggregate-cross-repo-completions.yml@main
    with:
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}
    secrets:
      app_id: ${{ secrets.TASK_DAG_APP_ID }}
      app_private_key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}
