name: Task-DAG

# Single, logic-free caller for all task-dag GitHub-Actions automation.
# All logic, scripts, and config live once in virusdave/task-dag; this file
# is pure event wiring. See virusdave/task-dag:docs/MIGRATION.md.
#
# `completion-aggregate`, `materialise`, and the App-authenticated
# `comment-sync` close-epic path mint the shared task-dag GitHub App token from
# TASK_DAG_APP_ID / TASK_DAG_APP_PRIVATE_KEY. Those secrets must remain
# provisioned before this workflow lands on master.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  push:
    branches: [master]

jobs:
  issue-to-task:
    if: ${{ github.event_name == 'issues' }}
    uses: virusdave/task-dag/.github/workflows/issue-to-task.yml@master
    permissions:
      contents: write
      issues: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Monotonic-completion reopen notice (task-dag issue #13). Reopening a
  # completed issue does not recreate its completed task; this job upserts the
  # status-markered operator notice explaining that any new work must be opened
  # as a new in-thread task.
  reopen-notice:
    if: ${{ github.event_name == 'issues' && github.event.action == 'reopened' }}
    uses: virusdave/task-dag/.github/workflows/reopen-notice.yml@master
    permissions:
      issues: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  comment-sync:
    if: ${{ github.event_name == 'issue_comment' }}
    # Serialize ingestion per issue so concurrent comments cannot race
    # through comment-sync -> ingest-comment -> close-epic. Distinct issues
    # stay parallel.
    concurrency:
      group: task-dag-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: virusdave/task-dag/.github/workflows/sync-comment-to-task.yml@master
    permissions:
      contents: write
      issues: write
    with:
      ref: master
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      # automation can originate cross-repo child epics via `materialise` and
      # can later auto-close the delegated parent from comment-sync. Use the
      # App token so that semantic close pushes can trigger the projection
      # backstop workflows despite GitHub's GITHUB_TOKEN recursion guard.
      app_id: ${{ secrets.TASK_DAG_APP_ID }}
      app_private_key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}

  close-completed:
    # Push is the low-latency path; schedule/manual are the master-derived
    # projection backstop when a push workflow was missed.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: virusdave/task-dag/.github/workflows/close-completed-issues.yml@master
    permissions:
      # contents: write (not read) — after closing an epic's issue the close
      # script deletes the now-stale tasks/pending/<N> + tasks/root-active/<N>
      # refs via `git push --delete`; read-only makes those deletes fail
      # silently (`|| true`), orphaning an epic-root ref for a CLOSED issue
      # that a dispatcher can then waste a worker "decomposing".
      contents: write
      issues: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  graph-converge:
    # Fold dependency-graph/mailbox edges from durable history on push and from
    # the schedule/manual backstop. Foreign completions remain legacy-ref
    # authoritative during the issue #13 repair window; graph edges are
    # additive until peer verification is provisioned in Actions.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: virusdave/task-dag/.github/workflows/graph-converge.yml@master
    permissions:
      contents: write
    with:
      base_sha: ${{ github.event_name == 'push' && github.event.before || '' }}
      head_sha: ${{ github.event_name == 'push' && github.sha || '' }}

  completion-aggregate:
    if: ${{ github.event_name == 'push' }}
    uses: virusdave/task-dag/.github/workflows/aggregate-cross-repo-completions.yml@master
    with:
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}
    secrets:
      app_id: ${{ secrets.TASK_DAG_APP_ID }}
      app_private_key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}

  # Materialise cross-repo child epics from `Materialise-Child-Epic:` commit
  # trailers pushed to this repo's master. Like `completion-aggregate` this is
  # a secret-gated cross-repo writer (mints a task-dag GitHub App token from
  # the same two App secrets to create the peer-repo issue). No-op on
  # trailer-free pushes. See virusdave/task-dag:docs/MIGRATION.md.
  materialise:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: virusdave/task-dag/.github/workflows/materialise-child-epic.yml@32ed52f56e6fb64029b1015afe0e9b726bf63d95
    permissions:
      contents: write
      issues: write
    with:
      base_sha: ${{ github.event_name == 'push' && github.event.before || '' }}
      head_sha: ${{ github.event_name == 'push' && github.sha || '' }}
      ref: 32ed52f56e6fb64029b1015afe0e9b726bf63d95
    secrets:
      app_id: ${{ secrets.TASK_DAG_APP_ID }}
      app_private_key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}
