name: task-dag Rust tests

on:
  push:
    branches: [master]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'src/**'
      - 'tests/**'
      - 'scripts/run-rust-tests.sh'
      - '.githooks/**'
      - '.github/workflows/cli-tests.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'src/**'
      - 'tests/**'
      - 'scripts/run-rust-tests.sh'
      - '.githooks/**'
      - '.github/workflows/cli-tests.yml'

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
        with:
          github-token: ''
      - name: Rust tests
        run: scripts/run-rust-tests.sh
