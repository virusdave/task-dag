name: Close Completed Task Issues
on:
  push:
    branches:
      - master
permissions:
  contents: read
  issues: write
jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close issues for completed task epics
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/close-completed-issues.sh
