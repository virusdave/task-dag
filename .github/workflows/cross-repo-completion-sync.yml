name: Cross-Repo Completion Sync

# When a push lands on master, scan the new commits for
# `Satisfies: virusdave/top-level#<N>` trailers and post a
# `<!-- task-dag:completion --> Satisfies …` comment on that issue so
# the top-level coordinator can ingest the completion into its DAG.
#
# Requires a GitHub App installed on virusdave/top-level with
# Issues: Read & write, exposed via repo/org secrets:
#   TASK_DAG_APP_ID          - the App ID (numeric)
#   TASK_DAG_APP_PRIVATE_KEY - the App's PEM-encoded private key

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  aggregate-cross-repo-completions:
    uses: Nicponskis/shared-workflows/.github/workflows/aggregate-cross-repo-completions.yml@master
    with:
      top_level_repo: virusdave/top-level
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}
    secrets:
      app_id: ${{ secrets.TASK_DAG_APP_ID }}
      app_private_key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}
