name: Reconcile Durable Child Epic Intents

# Temporary caller-compatibility shim. v1 automation is retired; Rust v2 is
# provider-free. This workflow intentionally performs no checkout or write.
on:
  workflow_call:
    inputs:
      base_sha:
        description: github.event.before from the caller (40-zero on first push).
        required: true
        type: string
      head_sha:
        description: github.sha from the caller.
        required: true
        type: string
      ref:
        description: 'Exact 40-hex task-dag commit containing the authorized reconciler'
        required: false
        type: string
        default: ''
    secrets:
      app_id:
        description: |
          GitHub App ID for the task-dag cross-repo bot. The App must be
          installed on every peer repo a child epic may be materialised in,
          with Issues: read & write. Typically stored as repo/org secret
          TASK_DAG_APP_ID.
        required: true
      app_private_key:
        description: |
          PEM-encoded private key for the same GitHub App.
          Typically stored as repo/org secret TASK_DAG_APP_PRIVATE_KEY.
        required: true

permissions: {}

jobs:
  retired:
    name: v1 automation retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "task-dag v1 automation is retired; Rust v2 is provider-free."
