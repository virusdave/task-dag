name: Reopen Notice (Reusable)

# Temporary caller-compatibility shim. v1 automation is retired; Rust v2 is
# provider-free. This workflow intentionally performs no checkout or write.
on:
  workflow_call:
    inputs:
      ref:
        description: 'task-dag ref to fetch the helper script from (branch, tag, or SHA)'
        type: string
        default: master
    secrets:
      token:
        description: 'GitHub token for gh API access (needs issues:write)'
        required: true

permissions: {}

jobs:
  retired:
    name: v1 automation retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "task-dag v1 automation is retired; Rust v2 is provider-free."
