name: Sync Task to Comment (Reusable)

# Temporary caller-compatibility shim. v1 automation is retired; Rust v2 is
# provider-free. This workflow intentionally performs no checkout or write.
on:
  workflow_call:
    inputs:
      max_batch_size:
        description: 'Maximum messages to post per run (rate limit protection)'
        type: number
        default: 10
      sync_interval_minutes:
        description: 'How often this should run (for scheduling)'
        type: number
        default: 5
      ref:
        description: 'task-dag ref to fetch helper scripts from (branch, tag, or SHA)'
        type: string
        default: master
    secrets:
      token:
        description: 'GitHub token for API access'
        required: true

permissions: {}

jobs:
  retired:
    name: v1 automation retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "task-dag v1 automation is retired; Rust v2 is provider-free."
