name: Issue to Task Metadata Commit (Reusable)

# Reusable version of the per-repo issue-to-task workflow. The caller wires
# its own `issues` event; this workflow fetches the canonical
# create-task-commit.sh from virusdave/task-dag and runs it against the
# caller's checkout (the script is self-contained: git + gh only).

on:
  workflow_call:
    inputs:
      ref:
        description: 'task-dag ref to fetch the helper script from (branch, tag, or SHA)'
        type: string
        default: master
    secrets:
      token:
        description: 'GitHub token for API + git access (needs contents:write, issues:write)'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  create-task-commit:
    runs-on: ubuntu-latest
    # Serialization reduces noise; epic-create's activation-generation CAS is
    # the correctness boundary for provider and materialisation races.
    concurrency:
      group: issue-to-task-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.token }}

      - name: Checkout coherent task-dag runtime
        uses: actions/checkout@v4
        with:
          repository: virusdave/task-dag
          ref: ${{ inputs.ref }}
          path: .task-dag-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Create metadata commit for issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_REPOSITORY: ${{ github.repository }}
          ISSUE_REPOSITORY_ID: ${{ github.event.repository.node_id }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          # Until epic-create owns an atomic blocked overlay, the adapter uses
          # this snapshot to fail closed before creating a labeled root.
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          # Invoke the exact coherent runtime checked out above.
          TASK_DAG_CLI: .task-dag-runtime/scripts/task-dag
          GH_TOKEN: ${{ secrets.token }}
        run: bash .task-dag-runtime/.github/scripts/create-task-commit.sh
