name: Task Completion Tracking
on:
  push:
    branches:
      - master
permissions:
  contents: read
  issues: write
jobs:
  check-task-completions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for task completions in pushed commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-task-completions.sh
