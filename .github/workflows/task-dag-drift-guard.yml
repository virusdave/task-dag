name: task-dag drift guard

# Ensures this repo's vendored scripts/task-dag (+ scripts/task-dag.d/) stays
# byte-identical to the canonical copy in virusdave/top-level. Never edit the
# vendored copy in place: change it in top-level, then re-sync (see
# top-level:docs/task_dag/CLI_DISTRIBUTION.md). canonical_ref is pinned to the
# exact top-level SHA this repo was last synced from.

on:
  push:
    paths:
      - 'scripts/task-dag'
      - 'scripts/task-dag.d/**'
      - '.github/workflows/task-dag-drift-guard.yml'
  pull_request:
    paths:
      - 'scripts/task-dag'
      - 'scripts/task-dag.d/**'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  guard:
    uses: Nicponskis/shared-workflows/.github/workflows/task-dag-drift-guard.yml@master
    with:
      canonical_repo: virusdave/top-level
      canonical_ref: 9c365e5cccf4e5a327328730fa49b4d5eef0dc32
    secrets:
      app_id: ${{ secrets.TASK_DAG_APP_ID }}
      app_private_key: ${{ secrets.TASK_DAG_APP_PRIVATE_KEY }}
