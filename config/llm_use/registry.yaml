# LLM Usage Registry
#
# All (backend, model, use-case) combinations must be recorded here before use.
# Mark as either `approved` or `limited-trial` with explicit scope.
#
# See: automation/docs/policy-review-compliance-architecture.md
# See: automation/AGENTS_MUST_KNOW.md lines 27-28

llm_usage:
  # Pending Purchase Taxonomy Classification (Limited Trial)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: pending-purchase-taxonomy-classification
    status: limited-trial
    scope: Midtown pending purchase packet generation only
    request_shape: structured-json
    approved_by: user
    approved_at: 2026-04-14
    notes: Fallback classifier when deterministic parsing fails

  # Landing Page Google Trigger Scanning - L1 Spot Checks (Approved)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: landing-page-l1-spot-check
    status: approved
    scope: Sample-based anomaly detection on 3-5 pages per family; LLM reviews extracted features not raw HTML
    request_shape: structured-json-findings
    approved_by: user
    approved_at: 2026-05-12
    notes: |
      L1 layer: cheap deterministic extraction + targeted LLM spot-checks.
      LLM sees: extracted feature vectors, family context, guided questions from L2.
      LLM returns: "looks fine" OR "flag for L2: [concern]" + confidence.
      Cost: ~$0.025 per full scan (5 pages/family × 5 families × $0.001).
      See: mostly-static-sites/docs/landing-page-google-trigger-scanner.md

  # Landing Page Google Trigger Scanning - L2 Prediction (Approved)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: landing-page-l2-google-trigger-prediction
    status: approved
    scope: Infer Google Ads triggers from aggregated L1 summaries + documented experiences; includes nearby-strategy search
    request_shape: structured-json-predictions-with-alternatives
    approved_by: user
    approved_at: 2026-05-12
    notes: |
      L2 layer: high-leverage LLM analysis on family summaries.
      Input: ~5K tokens (L1 summaries + documented Google experiences).
      Output: trigger predictions, nearby legitimate strategies, architecture improvements, L1 rule updates.
      Encodes white/grey-hat philosophy: optimize for (compliance × clarity × performance), not pure evasion.
      Nearby strategy search: when detecting evasive patterns, must propose compliant alternatives.
      Cost: ~$0.007 per L2 run.
      See: mostly-static-sites/docs/landing-page-google-trigger-scanner.md
      Prompt: mostly-static-sites/scripts/lib/prompts/l2-system-prompt-v1.txt

  # Landing Page Google Trigger Scanning - L3 Meta-Analysis (Approved)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: landing-page-l3-prompt-improvement
    status: approved
    scope: Meta-analyze L2 effectiveness against actual Google Ads outcomes; propose prompt improvements
    request_shape: structured-json-prompt-updates
    approved_by: user
    approved_at: 2026-05-12
    notes: |
      L3 layer: meta-analysis and self-improvement.
      Input: ~10K tokens (L2 prediction history + actual serving outcomes from Google Ads API).
      Output: prompt improvement proposals, L1 rule update recommendations, evaluation metrics.
      Governance: proposals written to staging, require human review before promotion.
      Future enhancement: multi-objective optimization (compliance × performance) when perf data available.
      Cost: ~$0.013 per L3 run.
      See: mostly-static-sites/docs/landing-page-google-trigger-scanner.md

  # Catalog Description Generation (Approved)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: catalog-description-generation
    status: approved
    scope: Helios catalog module description generation and debug reruns
    request_shape: structured-json
    approved_by: user
    approved_at: 2026-04-10
    notes: Recorded in llm_runs table with full audit trail

  # Pricing Market Context (Approved)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: pricing-market-context
    status: approved
    scope: Lit Alerts search term adaptation for thin-competition pricing cases
    request_shape: structured-json
    approved_by: user
    approved_at: 2026-04-12
    notes: Adapts search terms while maintaining AGENTS_MUST_KNOW.md constraints

  # Scheduling Constraint Extraction (Approved)
  - backend: bedrock-mantle
    model: google.gemma-3-27b-it
    use_case: scheduling-constraint-extraction
    status: approved
    scope: Helios scheduling module - natural language schedule requests to structured constraints
    request_shape: structured-json-with-repair
    approved_by: user
    approved_at: 2026-05-01
    notes: Uses JSON repair loop (up to 3 attempts) for robustness
